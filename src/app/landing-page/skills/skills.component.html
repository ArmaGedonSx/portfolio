<div class="skills-container relative">
  <div id="skills-border-1" class="relative h-[20px] lg:h-[30px] border-l-2 border-walnut left-[-24px]"></div>
  <div class="skills-text relative">
    <h2 id="skills-title" class="text-walnut monoton-regular text-2xl ps-3 lg:ps-0 lg:text-4xl lg:text-nowrap">Technológiák & Készségek</h2>
    <div id="skills-border-2" class="skill-title-trace hidden lg:block absolute w-[100%] h-[100%] lg:h-[55%] border-b-2 border-l-2 border-walnut bottom-[-4px] left-[-4px]"></div>
    <div id="skills-border-3" class="skill-title-trace-two absolute h-[100%] border-l-2 border-walnut bottom-[20px] left-[-24px]"></div>
    <div id="skills-border-3-1" class="skill-title-trace-two absolute w-[24px] border-b-2 border-walnut bottom-[20px] left-[-24px]"></div>
  </div>
  <div class="skill-grid grid grid-cols-12 gap-3 lg:gap-4 ps-[0px] pt-[10px] lg:ps-[32px] lg:pt-[20px] pb-4 relative">
    <div id="skills-border-4" class="tree-separator-skill absolute h-[110%] lg:h-[100%] w-[30px] lg:w-[60px] border-walnut border-r-2 top-[-24px] lg:top-0 left-[-28px]"></div>
    <app-skill-section 
      id="skill-section-0"
      class="skill-section col-span-12"
      [sectionIndex]="0"
      [title]="'Nyelvek & Alapok'" 
      [skills]="skills.languajes" 
      [technologies]="technologies">
    </app-skill-section>
    <app-skill-section 
      id="skill-section-1"
      class="skill-section col-span-12"
      [sectionIndex]="1"
      [title]="'Keretrendszerek & Reaktív UI'" 
      [skills]="skills.frameworks" 
      [technologies]="technologies">
    </app-skill-section>
    <app-skill-section 
      id="skill-section-2"
      class="skill-section col-span-12"
      [sectionIndex]="2"
      [title]="'Eszközök & Felhő & IoT'" 
      [skills]="skills.tools" 
      [technologies]="technologies">
    </app-skill-section>
  </div>
</div>
