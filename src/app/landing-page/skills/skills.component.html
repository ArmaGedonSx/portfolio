<div class="skills-container relative">
  <div id="skills-border-1" class="relative h-[10vh] md:h-[20vh] border-l-4 border-[#9e8857] left-[-24px]"></div>
  <div class="skills-text relative">
    <h2 id="skills-title" class="text-[#9e8857] monoton-regular text-2xl md:text-5xl md:text-nowrap">Technologies and knowledge</h2>
    <div id="skills-border-2" class="skill-title-trace hidden md:block absolute w-[100%] h-[100%] md:h-[55%] border-b-4 border-l-4 border-[#9e8857] bottom-[-4px] left-[-4px]"></div>
    <div id="skills-border-3" class="skill-title-trace-two absolute h-[100%] border-l-4 border-[#9e8857] bottom-[20px] left-[-24px]"></div>
    <div id="skills-border-3-1" class="skill-title-trace-two absolute w-[24px] border-b-4 border-[#9e8857] bottom-[20px] left-[-24px]"></div>
  </div>
  <div class="skill-grid grid grid-cols-12 gap-5 ps-[0px] pt-[10px]  md:ps-[32px] md:pt-[70px] pb-[20vh] md:pb-[10vh]  relative">
    <div id="skills-border-4" class="tree-separator-skill absolute h-[110%] md:h-[100%] w-[30px] md:w-[60px] border-[#9e8857] border-r-4 top-[-24px] md:top-0 left-[-28px]"></div>
    <app-skill-section 
      id="skill-section-0"
      class="skill-section col-span-12"
      [sectionIndex]="0"
      [title]="'Languages'" 
      [skills]="skills.languajes" 
      [technologies]="technologies"
      (sectionLoaded)="onSectionLoaded($event)">
    </app-skill-section>
    <app-skill-section 
      id="skill-section-1"
      class="skill-section col-span-12"
      [sectionIndex]="1"
      [title]="'Frameworks'" 
      [skills]="skills.frameworks" 
      [technologies]="technologies"
      (sectionLoaded)="onSectionLoaded($event)">
    </app-skill-section>
    <app-skill-section 
      id="skill-section-2"
      class="skill-section col-span-12"
      [sectionIndex]="2"
      [title]="'Tools'" 
      [skills]="skills.tools" 
      [technologies]="technologies"
      (sectionLoaded)="onSectionLoaded($event)">
    </app-skill-section>
  </div>
</div>
