<div id="proyects-container" class="proyects-container px-2 relative">
  <div class="proyects-title relative right-0 w-fit">
    <h3 id="proyects-title" class="monoton-regular text-2xl lg:text-5xl p-3 text-walnut">Válogatott Projektek</h3>
    <div id="proyects-border-1" class="absolute w-full h-[100%] border-t-2 border-walnut bottom-0"></div>
    <div id="proyects-border-1-2" class="absolute w-full h-[100%] border-l-2 border-r-2 border-walnut bottom-0"></div>
  </div>
  <div class="proyects-porfolio relative">
    <div class="relative p-[4px]">
      <!-- Bordes animados del swiper -->
      <div id="proyects-swiper-border-top" class="absolute top-0 left-0 w-full border-t-2 border-walnut z-10"></div>
      <div id="proyects-swiper-border-right" class="absolute top-0 right-0 h-full border-r-2 border-walnut z-10"></div>
      <div id="proyects-swiper-border-bottom" class="absolute bottom-0 left-0 w-full border-b-2 border-walnut z-10"></div>
      <div id="proyects-swiper-border-left" class="absolute top-0 left-0 h-full border-l-2 border-walnut z-10"></div>
      
      <div id="proyects-swiper" class="swiper projects-swiper overflow-hidden">
        <!-- Fondo parallax opcional -->
        <div class="parallax-bg" data-swiper-parallax="-23%"></div>
      
        <div class="swiper-wrapper">
          <div class="swiper-slide" [id]="'proyect-slide-' + i" *ngFor="let project of projects; let i = index">
            <!-- Imagen de fondo del proyecto con parallax -->
            <div [id]="'proyect-slide-bg-' + i" class="slide-bg" 
                 [style.background-image]="'url(/assets/img/' + project.previewImg + ')'" 
                 data-swiper-parallax="-23%"></div>
            
            <!-- Overlay oscuro para mejorar legibilidad -->
            <div [id]="'proyect-slide-overlay-' + i" class="slide-overlay bg-black/75" data-swiper-parallax="-15%"></div>
            
            <!-- Contenido del proyecto -->
            <div [id]="'proyect-slide-content-' + i" class="slide-content content-end" 
                 data-swiper-parallax="-300" 
                 data-swiper-parallax-opacity="0">
              <app-proyect-card [dataProject]="project" [hideImage]="true"></app-proyect-card>
            </div>
          </div>
        </div>

        <div class="swiper-button-prev !hidden !lg:flex !text-walnut hover:!text-walnut-light after:!text-3xl !left-3 transition-colors"></div>
        <div class="swiper-button-next !hidden !lg:flex !text-walnut hover:!text-walnut-light after:!text-3xl !right-3 transition-colors"></div>
      </div>
    </div>
  </div>
</div>
