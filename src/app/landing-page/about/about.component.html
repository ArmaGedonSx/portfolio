<div class="about-card flex justify-center items-center relative py-12 px-6">
  <div class="max-w-5xl mx-auto w-full">
    <div class="grid grid-cols-12 gap-8 lg:gap-12 items-center">
      
      <!-- Bal oszlop: Kép helye (Elegáns, arányos keret) -->
      <div class="col-span-12 lg:col-span-5 flex justify-center lg:justify-end">
        <div class="relative size-64 sm:size-72 lg:size-80 rounded-2xl bg-forge-surface border-2 border-walnut/40 flex flex-col items-center justify-center p-6 shadow-2xl shadow-black/60 overflow-hidden group">
          <!-- Finom belső díszítés és monogram kódjelvény -->
          <div class="size-20 rounded-full bg-forge-raised border border-walnut/30 flex items-center justify-center mb-3 shadow-inner">
            <span class="monoton-regular text-2xl text-walnut">JB</span>
          </div>
          <span class="text-xs text-parchment-muted uppercase tracking-widest font-mono">Bán János</span>
          <span class="text-[10px] text-walnut/70 uppercase tracking-wider mt-1">Full-Stack & Mobile</span>
        </div>
      </div>

      <!-- Jobb oszlop: Szöveges tartalom -->
      <div class="col-span-12 lg:col-span-7 flex flex-col items-start text-left">
        <!-- Címsor badge -->
        <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-forge-surface border border-walnut/30 text-[11px] text-walnut uppercase tracking-[0.25em] font-semibold mb-4 shadow-md">
          <span class="size-1.5 rounded-full bg-walnut animate-pulse"></span>
          <span>Rólam & Szemlélet</span>
        </div>

        <!-- Főcím -->
        <h2 class="text-walnut monoton-regular text-2xl sm:text-3xl lg:text-4xl mb-4 tracking-wide">
          <span class="typed-text"></span>
        </h2>

        <!-- Szövegtörzs -->
        <div class="about-message font-normal text-parchment-muted leading-relaxed text-sm sm:text-base max-w-xl"
             [innerHTML]="aboutMessage">
        </div>
      </div>

    </div>
  </div>
</div>
