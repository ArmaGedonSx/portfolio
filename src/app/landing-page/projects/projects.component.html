<div id="projects-container" class="projects-container px-2 sm:px-4 relative max-w-6xl mx-auto w-full flex flex-col justify-center">
  
  <!-- Szekció Fejléc (Szimmetrikus prémium keret) -->
  <div class="projects-title w-fit relative mb-6 mx-auto">
    <div class="relative px-6 sm:px-8 py-2 bg-forge-surface border-2 border-walnut rounded-xl shadow-xl">
      <h3 id="projects-title" class="monoton-regular text-2xl sm:text-3xl lg:text-4xl text-walnut tracking-wider text-center">
        Válogatott Projektek
      </h3>
    </div>
  </div>

  <!-- FŐ PROJEKT BEMUTATÓ (Split Showcase Swiper) -->
  <div class="projects-swiper-wrapper relative w-full">
    <div class="swiper projects-swiper overflow-hidden rounded-2xl">
      <div class="swiper-wrapper">
        <div class="swiper-slide !h-auto w-full" *ngFor="let project of projects; let i = index">
          <app-project-card 
            [dataProject]="project" 
            [projectIndex]="i" 
            [totalProjects]="projects?.length || 3"></app-project-card>
        </div>
      </div>
    </div>

    <!-- Alsó Letisztult Lapozó és Pöttyök (Végtelenített ciklikus lapozás) -->
    <div class="flex items-center justify-center gap-6 mt-4">
      <button (click)="prevSlide()" 
              class="p-2.5 rounded-xl bg-[#222222] hover:bg-[#C5A059] hover:text-black text-gray-300 border border-white/10 hover:border-[#C5A059]/50 transition-all duration-200 shadow-md cursor-pointer active:scale-95"
              title="Előző projekt">
        <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <!-- Morfolódó Pontok -->
      <div class="flex items-center gap-2">
        <span *ngFor="let p of projects; let i = index" 
              (click)="selectProject(i)"
              [class.active-dot]="activeIndex === i"
              class="project-dot cursor-pointer"
              [title]="'Projekt ' + (i + 1)"></span>
      </div>

      <button (click)="nextSlide()" 
              class="p-2.5 rounded-xl bg-[#222222] hover:bg-[#C5A059] hover:text-black text-gray-300 border border-white/10 hover:border-[#C5A059]/50 transition-all duration-200 shadow-md cursor-pointer active:scale-95"
              title="Következő projekt">
        <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>
  </div>

</div>
