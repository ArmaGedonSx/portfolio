<!-- Főoldal 100vh Szekció Deck Nézet -->
<div class="deck-viewport fixed inset-0 w-screen h-screen overflow-hidden bg-forge-black select-none">
  
  <!-- Szekció Panelek -->
  <div class="deck-track w-full h-full relative">
    
    <!-- 01: Home -->
    <section id="home" class="deck-panel" [class.active]="activeChapterIndex === 0">
      <div class="container lg:max-w-[1024px] xl:max-w-[1280px] 2xl:max-w-[1536px] 3xl:max-w-[1792px] m-auto w-full px-4 sm:px-6">
        <app-home (contactClick)="goToChapter(5)" (scrollDownClick)="goToChapter(1)"></app-home>
      </div>
    </section>

    <!-- 02: About -->
    <section id="about" class="deck-panel about" [class.active]="activeChapterIndex === 1">
      <div class="container lg:max-w-[1024px] xl:max-w-[1280px] 2xl:max-w-[1536px] 3xl:max-w-[1792px] m-auto w-full px-4 sm:px-6">
        <app-about [aboutMessage]="DATA?.about"></app-about>
      </div>
    </section>

    <!-- 03: Skills -->
    <section id="skills" class="deck-panel" [class.active]="activeChapterIndex === 2">
      <div class="container lg:max-w-[1024px] xl:max-w-[1280px] 2xl:max-w-[1536px] 3xl:max-w-[1792px] m-auto w-full px-4 sm:px-6">
        <app-skills [skills]="skills"></app-skills>
      </div>
    </section>

    <!-- 04: Projects -->
    <section id="projects" class="deck-panel" [class.active]="activeChapterIndex === 3">
      <div class="container lg:max-w-[1024px] xl:max-w-[1280px] 2xl:max-w-[1536px] 3xl:max-w-[1792px] m-auto w-full px-4 sm:px-6">
        <app-projects [projects]="projects"></app-projects>
      </div>
    </section>

    <!-- 05: Experience -->
    <section id="experience" class="deck-panel" [class.active]="activeChapterIndex === 4">
      <div class="container lg:max-w-[1024px] xl:max-w-[1280px] 2xl:max-w-[1536px] 3xl:max-w-[1792px] m-auto w-full px-4 sm:px-6">
        <app-experiences [experiences]="DATA?.experience"></app-experiences>
      </div>
    </section>

    <!-- 06: Contact -->
    <section id="contact" class="deck-panel" [class.active]="activeChapterIndex === 5">
      <div class="container lg:max-w-[1024px] xl:max-w-[1280px] 2xl:max-w-[1536px] 3xl:max-w-[1792px] m-auto w-full px-4 sm:px-6">
        <app-contact [contactInfo]="DATA?.contact" [philosophy]="DATA?.philosophy"></app-contact>
      </div>
    </section>

  </div>

  <!-- Részecske réteg a háttérben -->
  <app-particles-overlay></app-particles-overlay>

  <!-- Oldalsó Fejezet Navigátor (Jobb oldal, vertikálisan középre rendezve) -->
  <nav class="chapter-nav fixed right-3.5 sm:right-6 top-1/2 -translate-y-1/2 z-40 flex flex-col gap-3.5 items-end">
    <button *ngFor="let chapter of chapters; let i = index"
            (click)="goToChapter(i)"
            type="button"
            class="chapter-nav-item group relative flex items-center justify-end"
            [class.active]="activeChapterIndex === i"
            [attr.aria-label]="chapter.code + ' ' + chapter.name">
      
      <!-- Hover Tooltip / Fejezetcímke -->
      <span class="chapter-nav-label pointer-events-none opacity-0 group-hover:opacity-100 transition-all duration-200">
        <span class="text-walnut font-mono font-bold me-1.5">{{ chapter.code }}</span>
        <span class="text-parchment-ink">{{ chapter.name }}</span>
      </span>

      <!-- Pötty -->
      <span class="chapter-nav-dot block"></span>
    </button>
  </nav>

  <!-- Lebegő elérhetőségi modul (Kompakt, letisztult dock) -->
  <div class="floating-dock fixed bottom-6 right-5 lg:right-6 z-50 flex flex-col gap-2.5 items-end p-1.5 bg-forge-surface/95 rounded-full border border-walnut/40 shadow-xl backdrop-blur-md">
    
    <!-- Email / Kapcsolat gomb -->
    <a href="mailto:ban.jani2011@gmail.com"
       class="floating-dock-btn group relative flex items-center justify-center size-9 rounded-full bg-forge-raised hover:bg-walnut text-parchment-ink hover:text-forge-black border border-forge-hairline hover:border-walnut shadow-sm transition-colors duration-200"
       title="Email küldése">
      <span class="floating-tooltip absolute right-[45px] px-3 py-1 bg-forge-surface text-parchment-ink text-xs rounded border border-forge-hairline opacity-0 pointer-events-none group-hover:opacity-100 group-hover:pointer-events-auto transition-opacity duration-200 shadow-xl whitespace-nowrap font-medium">
        ban.jani2011&#64;gmail.com
      </span>
      <!-- Mail SVG Icon -->
      <svg class="size-4 text-parchment-ink group-hover:text-forge-black transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="20" height="16" x="2" y="4" rx="2"/>
        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
      </svg>
    </a>

    <!-- LinkedIn gomb -->
    <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer"
       class="floating-dock-btn group relative flex items-center justify-center size-9 rounded-full bg-forge-raised hover:bg-[#0077B5] text-parchment-ink hover:text-white border border-forge-hairline hover:border-[#0077B5] shadow-sm transition-colors duration-200"
       title="LinkedIn profil">
      <span class="floating-tooltip absolute right-[45px] px-3 py-1 bg-forge-surface text-parchment-ink text-xs rounded border border-forge-hairline opacity-0 pointer-events-none group-hover:opacity-100 group-hover:pointer-events-auto transition-opacity duration-200 shadow-xl whitespace-nowrap font-medium">
        LinkedIn profil
      </span>
      <!-- LinkedIn SVG Icon -->
      <svg class="size-3.5 text-parchment-ink group-hover:text-white transition-colors" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9v8.37H9.2V10.9H6.46M7.83 6.45a1.6 1.6 0 0 0-1.6 1.6 1.6 1.6 0 0 0 1.6 1.6 1.6 1.6 0 0 0 1.6-1.6 1.6 1.6 0 0 0-1.6-1.6Z"/>
      </svg>
    </a>

    <!-- GitHub gomb -->
    <a href="https://github.com/ArmaGedonSx" target="_blank" rel="noopener noreferrer"
       class="floating-dock-btn group relative flex items-center justify-center size-9 rounded-full bg-forge-raised hover:bg-walnut text-parchment-ink hover:text-forge-black border border-forge-hairline hover:border-walnut shadow-sm transition-colors duration-200"
       title="GitHub profil">
      <span class="floating-tooltip absolute right-[45px] px-3 py-1 bg-forge-surface text-parchment-ink text-xs rounded border border-forge-hairline opacity-0 pointer-events-none group-hover:opacity-100 group-hover:pointer-events-auto transition-opacity duration-200 shadow-xl whitespace-nowrap font-medium">
        GitHub profil
      </span>
      <!-- GitHub SVG Icon -->
      <svg class="size-4 text-parchment-ink group-hover:text-forge-black transition-colors" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.1-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2Z"/>
      </svg>
    </a>

  </div>

  <!-- Intro Splash Screen (Beköszönő nyitóképernyő 'Húzd el a belépéshez' csúszkával) -->
  <app-intro-splash (animationComplete)="onSplashComplete($event)"></app-intro-splash>
</div>
