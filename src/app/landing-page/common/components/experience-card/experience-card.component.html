<div class="experience-card-item relative w-full" *ngIf="experience">
  
  <!-- Center Timeline Node (Badge Circle with SVG Logo) -->
  <div class="absolute left-6 md:left-1/2 -translate-x-1/2 top-5 z-20">
    <div class="size-11 rounded-full bg-forge-surface border-2 border-walnut flex items-center justify-center shadow-md shadow-black/60 p-1">
      <img [src]="experience.companyIcon" class="size-7 rounded-full object-contain" [alt]="experience.company">
    </div>
  </div>

  <!-- Card Container (Alternating on Desktop, Right-aligned on Mobile) -->
  <div class="w-full" [ngClass]="{
    'pl-14 md:pl-0 md:w-[calc(50%-36px)] md:mr-auto': imageOnRight,
    'pl-14 md:pl-0 md:w-[calc(50%-36px)] md:ml-auto': !imageOnRight
  }">
    <div class="relative bg-forge-surface/95 border border-forge-hairline hover:border-walnut/60 rounded-xl p-5 md:p-6 shadow-xl transition-all duration-300">
      
      <!-- Horizontal Connector Bar (Desktop) -->
      <div *ngIf="imageOnRight" class="hidden md:block absolute top-8 -right-[36px] w-[36px] border-t-2 border-walnut/70 pointer-events-none"></div>
      <div *ngIf="!imageOnRight" class="hidden md:block absolute top-8 -left-[36px] w-[36px] border-t-2 border-walnut/70 pointer-events-none"></div>

      <!-- Header: Company Name & Date Pill -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3 pb-3 border-b border-forge-hairline">
        <div>
          <h4 class="text-walnut font-bold text-lg tracking-wide uppercase">{{ experience.company }}</h4>
          <p class="text-sm font-medium text-walnut-light">{{ experience.charge }}</p>
        </div>
        <span class="inline-flex items-center self-start sm:self-auto px-3 py-1 bg-forge-raised text-walnut rounded-md text-xs font-bold border border-forge-hairline tracking-wider whitespace-nowrap">
          {{ formatDate(experience.startTime) }} – {{ formatDate(experience.endTime) }}
        </span>
      </div>

      <!-- Body: Summary and Bullet Points (Optimized line length < 75 chars) -->
      <div class="space-y-3 max-w-md">
        <p class="text-parchment-muted text-sm leading-relaxed italic">
          "{{ experience.expDescription }}"
        </p>

        <ul *ngIf="experience.expDescriptionArr" class="space-y-2 text-xs sm:text-sm text-parchment-muted/90 list-none pl-0">
          <li *ngFor="let responsibility of experience.expDescriptionArr" class="flex items-start gap-2">
            <span class="text-walnut mt-1 text-xs">◆</span>
            <span class="leading-relaxed">{{ responsibility }}</span>
          </li>
        </ul>
      </div>

      <!-- Implemented Skills Pills -->
      <div *ngIf="experience.implementedSkills && technologies" class="flex flex-wrap gap-1.5 mt-4 pt-3 border-t border-forge-hairline">
        <span *ngFor="let skill of experience.implementedSkills" 
              class="px-2.5 py-0.5 rounded text-[11px] font-medium bg-forge-raised text-parchment-muted border border-forge-hairline">
          {{ technologies[skill]?.name || skill }}
        </span>
      </div>

    </div>
  </div>

</div>
