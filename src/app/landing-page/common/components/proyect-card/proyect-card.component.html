<div class="flex flex-col justify-between gap-4 px-5 py-5 bg-black/60 text-white/80 w-full h-[25%] min-h-[160px]">
  <div class="flex flex-col gap-2">
    <span class="proyect-title font-bold text-3xl leading-tight">{{dataProject.projectName}}</span>
    <p class="proyect-description text-white/70 leading-snug">{{dataProject.description}}</p>
  </div>

  <div class="card-buttons flex flex-wrap gap-2 justify-end pt-2">
    <a *ngIf="dataProject.projectURL" class="pe-2" [href]="dataProject.projectURL" target="_blank">
      <button class="px-6">View Web</button>
    </a>
    <a *ngIf="dataProject.githubRepository" [href]="dataProject.githubRepository" target="_blank">
      <button class="px-6">View Code</button>
    </a>
  </div>
</div>
